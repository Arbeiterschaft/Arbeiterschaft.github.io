title: JiLu Wang
tagline: Robotics Software Engineer | MSEE in UPenn
email: jlwang25@engineering.upenn.edu
description: Personal portfolio.

# Links shown in the footer. Delete any you don't use.
github: Arbeiterschaft
linkedin: jilu-wang-dannies

# Site URL. For a user site (your-username.github.io) leave baseurl empty.
# For a project site (github.com/you/repo) set baseurl: "/repo"
url: "https://Arbeiterschaft.github.io"
baseurl: ""

# Top navigation (right side of the top bar).
nav:
  - title: Projects
    url: /projects/
  - title: Blogs
    url: /blogs/
  - title: Interests
    url: /interests/

# One folder per category. Each file inside has `published: true/false` — the on/off switch.
collections:
  projects:
    output: true
    permalink: /projects/:title/
  blogs:
    output: true
    permalink: /blogs/:title/
  interests:
    output: true
    permalink: /interests/:title/

defaults:
  - scope:
      path: ""
    values:
      layout: default

markdown: kramdown
exclude: [README.md, Gemfile, Gemfile.lock, vendor, list.txt, project-template.md]
